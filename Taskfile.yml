version: '3'

# Turborepo monorepo task runner (go-task).
#
# Port map:
#   apps/api -> 3001 (already wired via apps/api's own .env; untouched here)
#   apps/web -> 3002 (overridden here at the task level; apps/web/.env is left
#                     untouched and still defaults to Next.js' implicit 3000,
#                     so anything invoking `next dev`/`next start` outside of
#                     this Taskfile still gets the old default)
#
# NOTE: apps/* and packages/* are intentionally not read/edited by this
# Taskfile's author. `start-api`/`start-web` assume the conventional Nest.js
# ("start"/"start:prod") and Next.js ("start") production scripts exist in
# those packages' package.json — verify before relying on `task run`.

vars:
  API_PORT: '3001'
  WEB_PORT: '3002'

tasks:
  help:
    desc: List all available tasks
    cmds:
      - task --list

  install:
    desc: Install all workspace dependencies (npm workspaces, root-level)
    cmds:
      - npm install

  dev-api:
    internal: true
    cmds:
      - npx turbo run dev --filter=./apps/api

  dev-web:
    internal: true
    env:
      PORT: '{{.WEB_PORT}}'
    cmds:
      - npx turbo run dev --filter=./apps/web

  dev:
    desc: Run api (port {{.API_PORT}}) and web (port {{.WEB_PORT}}) concurrently for local development
    deps:
      - dev-api
      - dev-web

  build:
    internal: true
    cmds:
      - npx turbo run build

  start-api:
    internal: true
    cmds:
      - npx turbo run start --filter=./apps/api

  start-web:
    internal: true
    env:
      PORT: '{{.WEB_PORT}}'
    cmds:
      - npx turbo run start --filter=./apps/web

  start:
    internal: true
    deps:
      - start-api
      - start-web

  run:
    desc: Production-style run - build all apps, then start api (port {{.API_PORT}}) and web (port {{.WEB_PORT}})
    cmds:
      - task: build
      - task: start

  stop:
    desc: Best-effort teardown of anything listening on {{.API_PORT}}/{{.WEB_PORT}} (standalone use only; process-compose handles its own teardown)
    platforms: [windows]
    ignore_error: true
    cmds:
      - powershell -NoProfile -Command "Get-NetTCPConnection -LocalPort {{.API_PORT}},{{.WEB_PORT}} -ErrorAction SilentlyContinue | Select-Object -ExpandProperty OwningProcess -Unique | ForEach-Object { Stop-Process -Id \$_ -Force -ErrorAction SilentlyContinue }"

  test:
    desc: Run the monorepo's test suite(s) via turbo
    cmds:
      - npx turbo run test

  # Read-only MCP server over the career inventory: packages/mcp-server, see its README.
  mcp:build:
    desc: Build the Resumiq MCP server (and the schemas package it imports)
    cmds:
      - npm run build --workspace=@resumiq/schemas
      - npm run build --workspace=@resumiq/mcp-server

  mcp:test:
    desc: Run the MCP server tests (fixture inventories only, never the real data_inventory.json)
    cmds:
      - npm run build --workspace=@resumiq/schemas
      - npm run test --workspace=@resumiq/mcp-server

  mcp:inspect:
    desc: Open the MCP Inspector (pinned) against the built server; set RESUMIQ_INVENTORY_PATH to point at an inventory
    cmds:
      - task: mcp:build
      - npx -y @modelcontextprotocol/inspector@0.17.2 node packages/mcp-server/dist/main.js

  scan-jobs:
    desc: Run a one-off job scan + ingest against the DB (needs DATABASE_URL from apps/api/.env only — no Redis/queue/worker required)
    cmds:
      - npx turbo run scan:jobs --filter=./apps/api

  # Cold-outreach agent: a self-contained folder (outreach/), see outreach/README.md.
  outreach:
    desc: Open Claude Code inside outreach/ (then type /outreach <list>, /outreach --resume <runId>)
    dir: outreach
    interactive: true
    cmds:
      - claude

  outreach:status:
    desc: Outreach pipeline counts per run (needs OUTREACH_DATABASE_URL in outreach/.env)
    dir: outreach
    cmds:
      - npm run outreach --silent -- status

  outreach:track-resumes:
    desc: Build the three fallback resumes (ai / swe / fullstack) from the data inventory into outreach/storage/tracks
    dir: outreach
    cmds:
      - npm run outreach --silent -- track-resumes

  outreach:review:
    desc: Terminal UI to approve / edit / kill outreach drafts and open their PDF (interactive)
    dir: outreach
    interactive: true
    cmds:
      - npm run outreach --silent -- review

  outreach:auth:
    desc: One-time Gmail sign-in for outreach (opens a browser; token saved outside the repo)
    dir: outreach
    interactive: true
    cmds:
      - npm run outreach --silent -- auth

  outreach:signature:
    desc: Fetch the Gmail signature into outreach/signature.html (emails are refused without it)
    dir: outreach
    cmds:
      - npm run outreach --silent -- signature

  outreach:tick:
    desc: Run one outreach tick now (sync replies, schedule, send what is due). The schedule runs this every 5 min
    dir: outreach
    cmds:
      - npm run outreach --silent -- tick

  outreach:cost:
    desc: What an outreach run used, in API-equivalent USD per company and in total (-- --run <id> [--json], or -- --all)
    dir: outreach
    cmds:
      - npm run outreach --silent -- cost {{.CLI_ARGS}}

  outreach:preview:
    desc: Write the exact first email and follow-up of a run's drafts as .eml files in outreach/storage/<run>/<slug>/ (-- --run <id> [--slug s]); no Gmail needed
    dir: outreach
    cmds:
      - npm run outreach --silent -- preview {{.CLI_ARGS}}

  outreach:test-send:
    desc: Send the real first email of a run's drafts to YOUR address only, subject-marked [TEST], no status change (-- --run <id> --to you@example.com [--slug s] [--limit N])
    dir: outreach
    cmds:
      - npm run outreach --silent -- test-send {{.CLI_ARGS}}

  outreach:playbook:
    desc: List or prune what the outreach agents learned (-- --agent researcher|writer|sourcer|verifier [--remove N])
    dir: outreach
    cmds:
      - npm run outreach --silent -- playbook {{.CLI_ARGS}}

  outreach:prune:
    desc: Erase contacts, dossiers, draft text, PDFs and run folders of dead outreach leads older than 180 days (add -- --dry-run to preview, -- --days N to change)
    dir: outreach
    cmds:
      - npm run outreach --silent -- prune {{.CLI_ARGS}}

  outreach:publish:
    desc: Push the outreach/ folder history to the standalone private repo yassine-krichen/cold-outreach-job-agent
    cmds:
      # The standalone repo lives on the second GitHub account; switch for the push, then back.
      - gh auth switch --user yassine-krichen
      - defer: gh auth switch --user Yassinekrn
      - git subtree push --prefix=outreach https://github.com/yassine-krichen/cold-outreach-job-agent.git main

  outreach:install-schedule:
    desc: Windows Task Scheduler - run the outreach tick every 5 minutes (only while you are signed in)
    dir: outreach
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install-schedule.ps1

  outreach:uninstall-schedule:
    desc: Remove the outreach tick from Windows Task Scheduler
    dir: outreach
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/uninstall-schedule.ps1
